<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>WELCOME TO THE TECH MAZE</title>
  <link rel="stylesheet" href="baseStyle.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>CODE: RED</h1>
    <h2>The Tech Maze!</h2>
    <p>
      Welcome to a maze built on logic, creativity, and courage.  
      Navigate the paths. Solve the challenges. Prove your power in tech.
    </p>

    <div class="buttons">
      <button class="start-btn" onclick="startGame()">Start Challenge</button>
      <button class="info-btn" onclick="showInfo()">How It Works</button>
    </div>
  </div>

  <script>
    function startGame() {
      localStorage.setItem("current_challenge", "0");
      localStorage.setItem("player_x", "0");
      localStorage.setItem("player_y", "1");
      window.location.href = "./maze/index.html";
    }

    function showInfo() {
      alert(
        "🧩 HOW IT WORKS:\n\n" +
        "• Solve challenges to escape the maze\n" +
        "• Use logic, creativity, and teamwork\n" +
        "Good luck!"
      );
    }
  </script>

</body>
</html
